<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jace Media</title>
<!--
  Jace Media for TVs (LG webOS, Android TV, any TV browser).
  One self-contained file: plain CSS and simple JavaScript (var, function, no
  arrow functions, no async/await, no ?. or ??, no CSS gap/inset/aspect-ratio),
  so it runs on TV browser engines going back years (LG webOS 4+).

  Remote: arrows move, OK opens, Back goes back (every screen is a step in the
  page's history, so Back works on every TV), hold OK or press a colored
  button for a menu, number buttons type a PIN, media buttons control video.
  Data comes from /api/app/* on the same site.
-->
<style>
  html { font-size: 20px; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0d10; color: #f2f4f7;
    font-family: "LG Smart UI", Roboto, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button, input { font-family: inherit; color: inherit; font-size: inherit; }
  button { background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; }
  :focus { outline: none; }
  .hidden { display: none !important; }
  #app { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  .muted { color: rgba(255,255,255,0.58); }
  .center { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  .spinner { width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 0.25rem solid rgba(255,255,255,0.12); border-top-color: #3ddc84; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(0.8rem); } to { opacity: 1; transform: none; } }

  /* Side menu */
  #nav { position: absolute; top: 0; left: 0; bottom: 0; width: 6.4rem; z-index: 5; padding: 2.2rem 0.9rem;
    background: linear-gradient(to right, rgba(0,0,0,0.8), rgba(0,0,0,0)); overflow: hidden; }
  #nav.open { width: 18rem; background-color: rgba(10,12,15,0.97); box-shadow: 1rem 0 3rem rgba(0,0,0,0.5); }
  .brand { display: flex; align-items: center; height: 3rem; margin: 0 0 2rem 0.35rem; white-space: nowrap; }
  .brand img { width: 2.9rem; height: 2.9rem; border-radius: 0.75rem; }
  .brand span { margin-left: 0.9rem; font-size: 1.35rem; font-weight: 700; opacity: 0; transition: opacity 0.15s; }
  #nav.open .brand span { opacity: 1; }
  .nav-item { display: flex; align-items: center; width: 100%; height: 3.3rem; margin-bottom: 0.35rem; padding: 0 1rem; border-radius: 0.9rem;
    color: rgba(255,255,255,0.55); font-size: 1.2rem; white-space: nowrap; transition: background-color 0.12s, color 0.12s; }
  .nav-item .ic { display: inline-block; width: 1.8rem; font-size: 1.45rem; text-align: center; flex-shrink: 0; }
  .nav-item .lb { margin-left: 1.1rem; opacity: 0; transition: opacity 0.15s; }
  #nav.open .nav-item .lb { opacity: 1; }
  .nav-item.on { color: #3ddc84; }
  .nav-item.on .ic { text-shadow: 0 0 1rem rgba(61,220,132,0.6); }
  .nav-item:focus { background: #fff; color: #0b0d10; }

  /* Pages */
  #main { position: absolute; top: 0; left: 6.4rem; right: 0; bottom: 0; overflow: hidden; }
  #scroll { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; padding: 2.4rem 3rem 5rem 3rem; }
  h1 { margin: 0 0 1.8rem 0.3rem; font-size: 2.3rem; font-weight: 700; letter-spacing: -0.01em; }
  .row { margin-bottom: 2.4rem; }
  .row h2 { margin: 0 0 0.7rem 0.3rem; font-size: 1.35rem; font-weight: 600; color: rgba(255,255,255,0.88); }
  .track { white-space: nowrap; overflow: hidden; padding: 1rem 0.6rem; margin: -1rem 0; }
  .grid { white-space: normal; padding: 0.6rem; margin: -0.6rem; }
  .grid .card { margin-bottom: 2rem; }

  .card { display: inline-block; vertical-align: top; width: 19rem; margin-right: 1.3rem; border-radius: 1rem; white-space: normal; transition: transform 0.12s ease-out; }
  .card.tall { width: 11.5rem; }
  .card.round { width: 9rem; text-align: center; }
  .card .pic { position: relative; width: 100%; padding-top: 56.25%; border-radius: 1rem; overflow: hidden; background: rgba(255,255,255,0.06); }
  .card.tall .pic { padding-top: 177.7%; }
  .card .pic img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .prog { position: absolute; left: 0; bottom: 0; height: 0.3rem; background: #3ddc84; }
  .card .t { margin-top: 0.65rem; font-size: 1.05rem; font-weight: 600; line-height: 1.3; max-height: 2.7rem; overflow: hidden; color: rgba(255,255,255,0.9); }
  .card .s { margin-top: 0.2rem; font-size: 0.9rem; color: rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card:focus { transform: scale(1.06); will-change: transform; }
  .card:focus .pic, .card.round:focus .face { box-shadow: 0 0 0 0.25rem #3ddc84, 0 0.8rem 2rem rgba(0,0,0,0.6); }
  .card:focus .t { color: #fff; }
  .badge { position: absolute; top: 0.6rem; left: 0.6rem; padding: 0.1rem 0.45rem; border-radius: 0.3rem; font-size: 0.75rem; font-weight: 700; background: #e5484d; color: #fff; }
  .src { position: absolute; top: 0.6rem; left: 0.6rem; padding: 0.1rem 0.45rem; border-radius: 0.3rem; font-size: 0.7rem; font-weight: 700; }
  .src.src-yt { background: #e5484d; color: #fff; }
  .src.src-jace { background: #3ddc84; color: #0c1410; }

  .hero { position: relative; height: 28rem; margin: -2.4rem -3rem 2.2rem -3rem; overflow: hidden; }
  .hero img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.55; }
  .hero .shade { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, #0b0d10 0%, rgba(11,13,16,0.55) 42%, rgba(11,13,16,0) 75%), linear-gradient(to right, rgba(11,13,16,0.94), rgba(11,13,16,0) 70%); }
  .hero .txt { position: absolute; left: 3rem; bottom: 2.4rem; width: 46rem; }
  .hero .k { color: #3ddc84; font-size: 1rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .hero .h { margin: 0.6rem 0; font-size: 2.6rem; font-weight: 700; line-height: 1.15; max-height: 6rem; overflow: hidden; }
  .hero .m { font-size: 1.2rem; color: rgba(255,255,255,0.72); }

  .btn { display: inline-block; margin: 1rem 1rem 0 0; padding: 0.8rem 1.9rem; border-radius: 3rem; background: rgba(255,255,255,0.1);
    font-size: 1.2rem; font-weight: 600; transition: transform 0.15s, background-color 0.12s; }
  .btn.white { background: #fff; color: #0b0d10; }
  .btn.green { background: #3ddc84; color: #0c1410; }
  .btn:focus { background: #fff; color: #0b0d10; transform: scale(1.06); box-shadow: 0 0 0 0.22rem #3ddc84; }
  .list { width: 46rem; }
  .list-btn { display: flex; align-items: center; width: 100%; margin-bottom: 0.7rem; padding: 1.05rem 1.6rem; border-radius: 1rem; background: rgba(255,255,255,0.06); font-size: 1.2rem; transition: background-color 0.12s; }
  .list-btn .v { margin-left: auto; color: rgba(255,255,255,0.55); font-size: 1.05rem; }
  .list-btn:focus { background: #fff; color: #0b0d10; }
  .list-btn:focus .v { color: rgba(0,0,0,0.6); }
  .list-btn.on .v { color: #3ddc84; }
  .section-title { margin: 2rem 0 0.8rem 0.3rem; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.5); }

  svg.icon { display: inline-block; vertical-align: middle; flex-shrink: 0; }
  .ctl svg.icon, .btn svg.icon, .list-btn svg.icon { margin: -0.15rem 0.45rem 0 0; }
  .ctl.only svg.icon { margin: -0.15rem 0 0; }
  .reload { position: absolute; top: 1.4rem; right: 2rem; z-index: 4; display: flex; align-items: center; padding: 0.6rem 1.2rem; border-radius: 3rem; background: rgba(0,0,0,0.55); font-size: 1.05rem; font-weight: 600; color: rgba(255,255,255,0.85); transition: transform 0.12s; }
  .reload svg.icon { margin-right: 0.45rem; }
  .reload:focus { background: #fff; color: #0b0d10; transform: scale(1.06); box-shadow: 0 0 0 0.2rem #3ddc84; }
  .face { display: inline-block; border-radius: 50%; object-fit: cover; background: rgba(61,220,132,0.18); color: #3ddc84; font-weight: 700; text-align: center; vertical-align: middle; }

  .post { display: inline-block; vertical-align: top; width: 30rem; margin: 0 1.3rem 1.6rem 0; padding: 1.3rem; border-radius: 1.1rem; background: rgba(255,255,255,0.05); white-space: normal; transition: transform 0.15s; }
  .post:focus { transform: scale(1.03); box-shadow: 0 0 0 0.22rem #3ddc84; background: rgba(255,255,255,0.08); }
  .post .who { display: flex; align-items: center; font-size: 1rem; }
  .post .who b { margin-left: 0.7rem; }
  .post .txt { margin-top: 0.8rem; font-size: 1.1rem; line-height: 1.45; max-height: 9.6rem; overflow: hidden; color: rgba(255,255,255,0.88); }
  .post img.pp { width: 100%; height: 14rem; margin-top: 0.8rem; border-radius: 0.8rem; object-fit: cover; }

  /* Profiles, PIN, sign in */
  .profiles { white-space: nowrap; }
  .profiles .p { display: inline-block; width: 11rem; margin: 0 1.2rem; padding: 1rem 0.6rem; border-radius: 1.4rem; text-align: center; vertical-align: top; transition: transform 0.15s; }
  .profiles .p:focus { transform: scale(1.08); background: rgba(255,255,255,0.06); }
  .profiles .p:focus .face { box-shadow: 0 0 0 0.28rem #3ddc84; }
  .profiles .n { margin-top: 0.9rem; font-size: 1.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dots { margin: 1.4rem 0 0.4rem; }
  .dots span { display: inline-block; width: 1.3rem; height: 1.3rem; margin: 0 0.55rem; border-radius: 50%; border: 0.16rem solid rgba(255,255,255,0.45); transition: background-color 0.1s; }
  .dots span.f { background: #fff; border-color: #fff; }
  .pad { display: inline-block; margin-top: 0.4rem; }
  .pad-row { white-space: nowrap; }
  .key { display: inline-block; width: 5.4rem; height: 4.2rem; margin: 0.35rem; border-radius: 1.1rem; background: rgba(255,255,255,0.08);
    font-size: 1.75rem; font-weight: 600; text-align: center; line-height: 4.2rem; vertical-align: top; transition: transform 0.12s, background-color 0.12s; }
  .key.small { font-size: 1.3rem; }
  .key svg.icon { vertical-align: -0.25rem; }
  .key:focus { background: #fff; color: #0b0d10; transform: scale(1.07); }
  .panel { padding: 2.4rem; border-radius: 1.6rem; background: rgba(255,255,255,0.04); }
  .qr { width: 14rem; height: 14rem; padding: 0.6rem; border-radius: 1.1rem; background: #fff; margin: 0 auto; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .code { display: inline-block; margin-top: 0.4rem; padding: 0.2rem 0.7rem; border-radius: 0.5rem; background: rgba(255,255,255,0.1); font-family: monospace; font-size: 1.5rem; letter-spacing: 0.25em; color: #fff; }
  .err { color: #ff8a8a; min-height: 1.6rem; font-size: 1.1rem; margin: 0.4rem 0; }

  input.search { width: 52rem; height: 4rem; padding: 0 2rem; border: 0; border-radius: 3rem; background: rgba(255,255,255,0.08); font-size: 1.4rem; vertical-align: top; }
  input.search:focus { background: rgba(255,255,255,0.14); box-shadow: 0 0 0 0.22rem #3ddc84; }

  /* Player */
  #player { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20; background: #000; }
  #pbox, .vbox { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; background: #000; }
  .vbox video { width: 100%; height: 100%; background: #000; }
  .yt { position: absolute; left: 0; right: 0; top: -12%; bottom: -12%; pointer-events: none; }
  .yt iframe { width: 100%; height: 100%; border: 0; }
  #ui { position: absolute; top: 0; left: 0; right: 0; bottom: 0; transition: opacity 0.3s; }
  #ui { visibility: visible; transition: opacity 0.3s, visibility 0s; }
  #ui.off { opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0s 0.3s; }
  #ui .top .who { display: flex; align-items: center; margin-top: 0.5rem; font-size: 1.15rem; color: rgba(255,255,255,0.85); }
  #ui .top .who .face { margin-right: 0.7rem; }
  #ui .top { position: absolute; top: 0; left: 0; right: 0; padding: 2.2rem 3rem 5rem 3rem; background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0)); }
  #ui .top .h { font-size: 1.8rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ui .bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 6rem 3rem 1.8rem 3rem; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.92)); }
  .bar { display: flex; align-items: center; font-size: 1.05rem; color: rgba(255,255,255,0.82); }
  .bar .line { flex: 1; height: 0.35rem; margin: 0 1rem; border-radius: 1rem; background: rgba(255,255,255,0.22); overflow: hidden; }
  .bar .fill { height: 100%; width: 0; background: #3ddc84; }
  .ctls { margin-top: 1rem; }
  .ctls .ctl { margin-bottom: 0.6rem; }
  .ctl { display: inline-block; margin: 0 0.7rem 0 0; padding: 0.75rem 1.35rem; border-radius: 3rem; background: rgba(255,255,255,0.12); font-size: 1.2rem; font-weight: 600; transition: transform 0.12s; }
  .ctl:focus { background: #fff; color: #0b0d10; transform: scale(1.06); box-shadow: 0 0 0 0.2rem #3ddc84; }
  .ctl.on { background: #3ddc84; color: #0c1410; }
  #toast { position: fixed; top: 50%; left: 50%; z-index: 60; margin: -2rem 0 0 -9rem; width: 18rem; padding: 1rem; border-radius: 3rem; background: rgba(0,0,0,0.78); font-size: 1.4rem; font-weight: 700; text-align: center; }
  #ui .next .card { width: 14rem; }
  #ui .next .card .t { font-size: 0.95rem; max-height: 2.5rem; }

  /* Side sheet (comments, description) and menu */
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: 38rem; z-index: 40; padding: 2rem 2rem 2rem 2.2rem; background: rgba(14,16,20,0.97); box-shadow: -1rem 0 3rem rgba(0,0,0,0.6); overflow: hidden; animation: rise 0.2s ease; }
  .sheet h2 { margin: 0 0 1rem; font-size: 1.5rem; }
  .sheet .body { position: absolute; top: 5rem; left: 2.2rem; right: 2rem; bottom: 1.5rem; overflow: hidden; }
  .item { display: block; width: 100%; margin-bottom: 0.7rem; padding: 0.9rem 1rem; border-radius: 0.9rem; font-size: 1.05rem; line-height: 1.45; }
  .item:focus { background: rgba(255,255,255,0.08); box-shadow: inset 0 0 0 0.15rem #3ddc84; }
  .item b { display: block; font-size: 0.95rem; color: rgba(255,255,255,0.65); margin-bottom: 0.25rem; }
  #menu { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 80; background: rgba(0,0,0,0.55); }
  #menu .box { position: absolute; top: 50%; left: 50%; width: 30rem; margin-left: -15rem; transform: translateY(-50%); padding: 1rem; border-radius: 1.4rem; background: #15181d; box-shadow: 0 1.5rem 4rem rgba(0,0,0,0.6); animation: rise 0.18s ease; }
  #menu .ttl { padding: 0.6rem 1rem 1rem; font-size: 1.05rem; color: rgba(255,255,255,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #menu button { display: block; width: 100%; padding: 0.85rem 1.1rem; border-radius: 0.8rem; font-size: 1.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #menu button svg.icon { margin: -0.15rem 0.7rem 0 0; opacity: 0.85; }
  #menu button:focus { background: #fff; color: #0b0d10; }
  #menu button.danger { color: #ff8a8a; }
  #menu button.danger:focus { background: #ff8a8a; color: #0b0d10; }

  /* Shorts */
  #shorts { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #shortstage { position: absolute; top: 1.4rem; bottom: 1.4rem; left: 50%; width: 31.6rem; margin-left: -19rem; border-radius: 1.4rem; overflow: hidden; background: #000; box-shadow: 0 1rem 3rem rgba(0,0,0,0.6); transition: box-shadow 0.15s; }
  #shortstage:focus { box-shadow: 0 0 0 0.25rem #3ddc84, 0 1rem 3rem rgba(0,0,0,0.6); }
  #shortinfo { position: absolute; left: 0; right: 0; bottom: 0; padding: 6rem 1.4rem 1.4rem; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.85)); pointer-events: none; }
  #shortinfo .who { display: flex; align-items: center; font-size: 1.05rem; font-weight: 600; }
  #shortinfo .who .face { margin-right: 0.7rem; }
  #shortinfo .tt { margin-top: 0.6rem; font-size: 1.1rem; line-height: 1.35; max-height: 3rem; overflow: hidden; }
  #rail { position: absolute; top: 50%; left: 50%; margin-left: 14.2rem; transform: translateY(-50%); width: 6rem; text-align: center; }
  .rb { display: block; width: 6rem; margin-bottom: 1rem; font-size: 0.9rem; color: rgba(255,255,255,0.75); text-align: center; }
  .rb .o { display: block; width: 4rem; height: 4rem; margin: 0 auto 0.35rem; border-radius: 50%; background: rgba(255,255,255,0.1); font-size: 1.6rem; line-height: 4rem; overflow: hidden; transition: transform 0.12s, background-color 0.12s; }
  .rb .o svg.icon { vertical-align: -0.35rem; }
  .rb.on .o { background: #3ddc84; color: #0c1410; }
  .rb:focus .o { background: #fff; color: #0b0d10; transform: scale(1.12); box-shadow: 0 0 0 0.2rem #3ddc84; }
  .rb:focus { color: #fff; }
  #shorthint { position: absolute; right: 3rem; bottom: 2rem; font-size: 1rem; line-height: 1.8; color: rgba(255,255,255,0.45); text-align: right; }
  #shortcount { position: absolute; right: 3rem; top: 2rem; font-size: 1rem; color: rgba(255,255,255,0.45); }
</style>
</head>

  // ---------- Video: a Jace video file or YouTube (privacy-enhanced, YouTube's own buttons cropped out) ----------
  var current = null, ytReady = null;
  function loadYT() {
    if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
    if (!ytReady) {
      ytReady = new Promise(function (resolve) {
        window.onYouTubeIframeAPIReady = function () { resolve(window.YT); };
        var s = document.createElement("script");
        s.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(s);
      });
    }
    return ytReady;
  }
  function surface(box, stream, opts) {
    if (current) current.destroy();
    box.innerHTML = "";
    var s;
    if (stream.type === "file") {
      var v = document.createElement("video");
      v.src = stream.url;
      v.autoplay = true;
      v.loop = !!opts.loop;
      v.setAttribute("playsinline", "");
      if (opts.cover) v.style.objectFit = "cover";
      v.addEventListener("ended", function () { if (opts.onEnded) opts.onEnded(); });
      v.addEventListener("play", function () { if (opts.onState) opts.onState(true); });
      v.addEventListener("pause", function () { if (opts.onState) opts.onState(false); });
      box.appendChild(v);
      s = {
        toggle: function () { if (v.paused) v.play(); else v.pause(); },
        play: function () { v.play(); }, pause: function () { v.pause(); },
        seek: function (x) { v.currentTime = Math.max(0, v.currentTime + x); },
        time: function () { return v.currentTime; }, duration: function () { return v.duration || 0; },
        paused: function () { return v.paused; },
        rate: function (r) { v.playbackRate = r; },
        quality: function () {},
        captions: function () { return false; },
        destroy: function () { v.pause(); v.removeAttribute("src"); try { v.load(); } catch (err) {} },
      };
    } else {
      var holder = document.createElement("div");
      holder.className = "yt";
      var el = document.createElement("div");
      holder.appendChild(el);
      box.appendChild(holder);
      var p = null, gone = false;
      loadYT().then(function (YT) {
        if (gone) return;
        p = new YT.Player(el, {
          videoId: stream.id, host: "https://www.youtube-nocookie.com", width: "100%", height: "100%",
          playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, modestbranding: 1, iv_load_policy: 3, playsinline: 1, loop: opts.loop ? 1 : 0, playlist: opts.loop ? stream.id : undefined, origin: location.origin, vq: QUALITIES[qualityIndex()][0] },
          events: {
            onReady: function (e) {
              var q = QUALITIES[qualityIndex()][0];
              try { if (q !== "default") e.target.setPlaybackQuality(q); } catch (err) {}
              e.target.playVideo();
            },
            onStateChange: function (e) {
              if (opts.onState) opts.onState(e.data === 1 || e.data === 3);
              if (e.data === 0 && opts.onEnded) opts.onEnded();
            },
          },
        });
      });
      s = {
        toggle: function () { if (!p) return; if (p.getPlayerState() === 1) p.pauseVideo(); else p.playVideo(); },
        play: function () { if (p) p.playVideo(); }, pause: function () { if (p) p.pauseVideo(); },
        seek: function (x) { if (p) p.seekTo(Math.max(0, p.getCurrentTime() + x), true); },
        time: function () { return p && p.getCurrentTime ? p.getCurrentTime() : 0; },
        duration: function () { return p && p.getDuration ? p.getDuration() : 0; },
        paused: function () { return !p || p.getPlayerState() !== 1; },
        rate: function (r) { if (p) p.setPlaybackRate(r); },
        quality: function (q) {
          if (!p) return;
          try {
            var at = p.getCurrentTime();
            p.setPlaybackQuality(q);
            p.loadVideoById({ videoId: stream.id, startSeconds: at, suggestedQuality: q });
          } catch (err) {}
        },
        captions: function (on) {
          if (!p) return false;
          try {
            if (!on) { p.setOption("captions", "track", {}); p.unloadModule("captions"); return true; }
            p.loadModule("captions");
            var pick = function () {
              var list = p.getOption("captions", "tracklist") || [], t = null;
              for (var i = 0; i < list.length; i++) if (list[i].languageCode.indexOf("en") === 0) { t = list[i]; break; }
              t = t || list[0];
              if (t) p.setOption("captions", "track", { languageCode: t.languageCode });
            };
            setTimeout(pick, 800);
            setTimeout(pick, 2200);
            return true;
          } catch (err) { return false; }
        },
        destroy: function () { gone = true; try { if (p) p.destroy(); } catch (err) {} },
      };
    }
    current = s;
    return s;
  }

  // ---------- Player ----------
  var SPEEDS = [1, 1.25, 1.5, 2, 0.75];
  // YouTube's names for qualities. It treats the choice as a request (it may pick lower on slow internet).
  var QUALITIES = [["default", "Auto"], ["highres", "4K"], ["hd1440", "1440p"], ["hd1080", "1080p"], ["hd720", "720p"], ["large", "480p"]];
  function qualityIndex() {
    var q = localStorage.getItem("jm_tv_quality") || "default";
    for (var i = 0; i < QUALITIES.length; i++) if (QUALITIES[i][0] === q) return i;
    return 0;
  }
  function play(v) {
    var layerEl = null, s = null, info = null, hideTimer = null, timer = null, upNext = [];
    var cc = false, speed = 0, vote = 0, subscribed = false;
    function showUi() {
      if (!layerEl) return;

      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () {
        if (s && !s.paused() && !document.querySelector(".sheet") && !menuOpen && layerEl) layerEl.querySelector("#ui").className = "off";
      }, 5000);
    }
    function uiHidden() { return layerEl && layerEl.querySelector("#ui").className === "off"; }
    function btn(a, label, extra) { return '<button class="ctl' + (extra || "") + '" data-tv data-a="' + a + '">' + label + "</button>"; }
    function renderButtons() {
      var w = layerEl.querySelector("#ctls");
      var signed = signedIn();
      var paused = s && s.paused();
      w.innerHTML = btn("rew", icon("rew") + "10") + btn("pp", icon(paused ? "play" : "pause") + (paused ? "Play" : "Pause")) + btn("ff", "10&nbsp;" + icon("ff")) +
        (v.source === "youtube" ? btn("cc", icon("cc") + "CC", cc ? " on" : "") : "") + btn("speed", icon("speed") + SPEEDS[speed] + "×") +
        (v.source === "youtube" ? btn("quality", icon("expand") + QUALITIES[qualityIndex()][1]) : "") +
        (signed ? btn("like", icon("like") + (info && info.video.likes ? compact(info.video.likes + (vote === 1 ? 1 : 0) - (info.video.myVote === 1 ? 1 : 0)) : "Like"), vote === 1 ? " on" : "") +
          btn("dislike", icon("dislike"), (vote === -1 ? " on" : "") + " only") : "") +
        (signed ? btn("save", icon("clock") + "Save") : "") + btn("info", icon("info") + "Info") + btn("comments", icon("comment") + "Comments") +
        (info && info.video.channelId ? '<button class="ctl" data-tv data-a="channel" data-chan="' + rememberChannel({ kind: v.source, id: info.video.channelId, name: info.video.channelName, picture: info.video.channelPicture }) + '">' +
          face(info.video.channelName, info.video.channelPicture, 1.5) + "&nbsp; " + esc(info.video.channelName) + "</button>" : "");
      var pp = w.querySelector('[data-a="pp"]');
      pp.setAttribute("data-tv-default", "");
      var chBtn = w.querySelector('[data-a="channel"]');
      if (chBtn && v.source !== "youtube") chBtn.setAttribute("data-a", "nochannel");
      each(w.querySelectorAll("[data-a]"), function (b) { b.addEventListener("click", function () { act(b.getAttribute("data-a"), b); }); });
    }
    function act(a, b) {
      if (a === "rew") s.seek(-10);
      else if (a === "ff") s.seek(10);
      else if (a === "pp") s.toggle();
      else if (a === "cc") { cc = !cc; s.captions(cc); toast(cc ? "Captions on" : "Captions off"); }
      else if (a === "quality") {
        var qi = (qualityIndex() + 1) % QUALITIES.length;

    var html = '<div class="row" style="display:flex;align-items:center">' + face(a.name, a.picture, 6) + '<div style="margin-left:1.5rem"><h1 style="margin:0">' + esc(a.name) +
      '</h1><p class="muted" style="margin:0.35rem 0 0;font-size:1.1rem">@' + esc(a.handle) + '</p></div></div><p id="youmsg" style="color:#3ddc84;font-size:1.15rem;min-height:1.5rem;margin:0 0 0.6rem 0.3rem"></p><div class="list">' +
      '<button class="list-btn" data-tv data-tv-default id="b-prof">' + icon("users") + 'Switch profile</button>' +
      (a.hasPin ? '<button class="list-btn" data-tv id="b-lock">' + icon("lock") + 'Lock now</button><button class="list-btn" data-tv id="b-change">Change PIN</button><button class="list-btn" data-tv id="b-rm">Remove PIN</button>'
        : '<button class="list-btn" data-tv id="b-set">' + icon("lock") + 'Lock this profile with a PIN</button>') +
      '<div class="section-title">Show content from</div>';
    for (var i = 0; i < SERVICES.length; i++) {
      var isOn = services.indexOf(SERVICES[i][0]) >= 0;
      html += '<button class="list-btn' + (isOn ? " on" : "") + '" data-tv data-svc="' + SERVICES[i][0] + '">' + SERVICES[i][1] + '<span class="v">' + (isOn ? "On" : "Off") + "</span></button>";
    }
    html += '<div class="section-title">Content filter</div>';
    for (var j = 0; j < LEVELS.length; j++) {
      var sel = ext.rating === LEVELS[j][0];
      html += '<button class="list-btn' + (sel ? " on" : "") + '" data-tv data-level="' + LEVELS[j][0] + '">' + LEVELS[j][1] + '<span class="v">' + (sel ? icon("check", 1.2) : "") + "</span></button>";
    }
    html += '<div class="section-title">Account</div><button class="list-btn" data-tv id="b-out">Sign out</button></div>';
    frame(html);
    function msg(t) { var m = byId("youmsg"); if (m) m.textContent = t; }
    function on(id, fn) { var el = byId(id); if (el) el.addEventListener("click", fn); }
    on("b-prof", profiles);
    on("b-lock", function () { sessionStorage.removeItem(UNLOCK); pinPad(state.me.account); });
    on("b-out", function () {
      api("/api/auth/signout", "POST", undefined, true).catch(function () {}).then(function () { sessionStorage.removeItem(UNLOCK); cache = {}; return loadMe(); }).then(enter);
    });
    function setNew() {
      newPin("Choose a 4-number PIN", function (first) {
        newPin("Enter it again", function (second) {
          if (first !== second) { goTab("you"); msg("Those didn’t match. Try again."); return; }
          api("/api/tv/pin", "PUT", { pin: first }, true).then(loadMe).then(function () { goTab("you"); msg("PIN set. This profile now asks for it on TVs."); })
            .catch(function (e) { goTab("you"); msg(e.message); });
        });
      });
    }
    on("b-set", setNew);
    on("b-change", function () {
      newPin("Enter your current PIN", function (cur) {
        newPin("Choose a new PIN", function (pin) {
          api("/api/tv/pin", "PUT", { pin: pin, currentPin: cur }, true).then(loadMe).then(function () { goTab("you"); msg("PIN changed."); })
            .catch(function (e) { goTab("you"); msg(e.message); });
        });
      });
    });
    on("b-rm", function () {
      newPin("Enter your PIN to remove it", function (pin) {
        api("/api/tv/pin", "PUT", { pin: null, currentPin: pin }, true).then(loadMe).then(function () { goTab("you"); msg("PIN removed."); })
          .catch(function (e) { goTab("you"); msg(e.message); });
      });
    });
    each(page().querySelectorAll("[data-svc]"), function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-svc"), list = (state.me.services || []).slice(), at = list.indexOf(id);
        if (at >= 0) list.splice(at, 1); else list.push(id);
        if (!list.length) { msg("Keep at least one service on."); return; }
        api("/api/preferences", "PUT", { services: list }).then(function () {
          state.me.services = list;
          cache = {};
          var nowOn = list.indexOf(id) >= 0;
          b.className = "list-btn" + (nowOn ? " on" : "");
          b.querySelector(".v").textContent = nowOn ? "On" : "Off";
        }).catch(function (e) { msg(e.message); });
      });
    });
    each(page().querySelectorAll("[data-level]"), function (b) {
      b.addEventListener("click", function () {
        var lv = b.getAttribute("data-level"), next = {};
        for (var key in ext) if (Object.prototype.hasOwnProperty.call(ext, key)) next[key] = ext[key];
        next.rating = lv;
        api("/api/extensions", "PUT", next).then(function () {
          ext.rating = lv;
          cache = {};
          each(page().querySelectorAll("[data-level]"), function (x) {
            var sel = x.getAttribute("data-level") === lv;
            x.className = "list-btn" + (sel ? " on" : "");
            x.querySelector(".v").innerHTML = sel ? icon("check", 1.2) : "";
          });
        }).catch(function (e) { msg(e.message); });
      });
    });
    focusDefault();
  }
  function newPin(title, done) {
    var digits = "";
    pinActive = true;
    open({
      render: function () {
        frame('<div style="text-align:center;padding-top:2.4rem"><h1 style="margin:0">' + esc(title) + "</h1>" + dotsHtml(0) + "<div style=\"height:1rem\"></div>" + padHtml() + "</div>");
        function redraw(k) {
          var d = page().querySelector(".dots");
          if (d) d.outerHTML = dotsHtml(digits.length);
          var again = k ? page().querySelector('[data-k="' + k + '"]') : null;
          if (again) again.focus();
        }
        function add(k, fromRemote) {
          var keep = fromRemote ? null : k;
          if (k === "⌫") { digits = digits.slice(0, -1); redraw(keep); return; }
          if (k === "✕") { digits = ""; redraw(keep); return; }
          digits = (digits + k).slice(0, 4);
          redraw(keep);
          if (digits.length === 4) {
            var pin = digits;
            digits = "";
            pinActive = false;
            keyHandler = null;
            setTimeout(function () { done(pin); }, 150);
          }
        }
        each(page().querySelectorAll("[data-k]"), function (b) { b.addEventListener("click", function () { add(b.getAttribute("data-k")); }); });
        keyHandler = function (e) {
          var n = numberFrom(e);
          if (n >= 0) { add(String(n), true); return true; }
          return false;
        };
        focusDefault();
      },
      leave: function () { keyHandler = null; pinActive = false; },
    });
  }

  // ---------- Locking: Home button, another app, or the TV turning off locks a PIN profile again ----------
  var lockedWhileAway = false;
  function lockIfPinned() {
    var a = state.me && state.me.account;
    if (a && a.hasPin) { sessionStorage.removeItem(UNLOCK); lockedWhileAway = true; if (current) current.pause(); }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) lockIfPinned();
    else if (lockedWhileAway) {
      lockedWhileAway = false;
      var p = byId("player");
      if (p) p.parentNode.removeChild(p);
      if (current) { current.destroy(); current = null; }
      var s = document.querySelector(".sheet");
      if (s) s.parentNode.removeChild(s);
      var m = byId("menu");
      if (m) m.parentNode.removeChild(m);
      menuOpen = false;
      enter();
    }
  });
  window.addEventListener("pagehide", lockIfPinned);
  document.addEventListener("webOSRelaunch", function () { if (lockedWhileAway) { lockedWhileAway = false; enter(); } });

  // ---------- Start ----------
  function loadMe() {
    return api("/api/app/me", "GET", undefined, true).then(function (me) {
      state.me = me;
      following = {};
      loadFollowing();
      return me;
    }).catch(function () { state.me = { account: null, others: [] }; return state.me; });
  }
  function enter() {
    var me = state.me;
    if (state.guest) { clearGate(); goTab("home"); return; }
    if (!me || !me.account) return signIn();
    if (me.account.hasPin && sessionStorage.getItem(UNLOCK) !== me.account.sub) return pinPad(me.account);
    clearGate();
    goTab("home");
  }
  // One base step in the history, so Back always reaches the app first.
  history.replaceState({ d: 0 }, "");
  setTimeout(loadYT, 1500);
  loadMe().then(function (me) {
    if (me.account && me.others.length && !sessionStorage.getItem(UNLOCK) && !state.guest) profiles();
    else enter();
  });
})();
</script>
</body>
</html>
