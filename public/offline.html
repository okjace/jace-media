<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111317" />
    <title>Offline · Jace Media</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111317;
        color: #e6e8eb;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 20px;
      }
      h1 {
        font-size: 22px;
        margin: 20px 0 8px;
      }
      p {
        color: #8b919c;
        margin: 0 0 24px;
      }
      button {
        background: #3ddc84;
        color: #0c1410;
        border: 0;
        border-radius: 999px;
        padding: 10px 22px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Jace Media needs the internet for posts and videos. It'll be right here when you're back.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
