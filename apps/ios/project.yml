# The iPhone and iPad app, built on GitHub's Macs: `xcodegen` turns this into JaceMedia.xcodeproj (not committed).
# Unsigned: AltStore / SideStore sign it with your own (free) Apple ID when they install it.
name: JaceMedia
options:
  bundleIdPrefix: com.okjace
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.0.0"      # CI passes the real version (apps/VERSION)
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: "NO"
targets:
  JaceMedia:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okjace.jacemedia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
    scheme: {}
