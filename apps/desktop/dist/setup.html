<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Set up Jace Media</title>
<style>
  :root { --bg: #111317; --fg: #e6e8eb; --panel: #1c1f26; --line: #2a2f38; --muted: #8b919c; --accent: #3ddc84; --on-accent: #0c1410; --danger: #f87171; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; }
  body { display: flex; flex-direction: column; }
  main { flex: 1; padding: 28px 32px 0; overflow: auto; }
  footer { display: flex; align-items: center; gap: 10px; padding: 16px 32px 20px; border-top: 1px solid var(--line); }
  .steps { margin-right: auto; display: flex; gap: 6px; }
  .steps i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .steps i.on { background: var(--accent); }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: var(--muted); }
  .hero { display: flex; gap: 20px; align-items: flex-start; }
  .hero img { width: 84px; height: 84px; border-radius: 20px; flex-shrink: 0; }
  ul { margin: 6px 0 0; padding-left: 18px; color: var(--fg); }
  li { margin: 4px 0; }
  label.field { display: block; margin: 14px 0 6px; font-weight: 600; }
  .row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; outline: none; user-select: text; }
  input[type=text]:focus { border-color: var(--accent); }
  .check { display: flex; gap: 10px; align-items: center; padding: 10px 12px; margin-top: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .check small { display: block; color: var(--muted); }
  button { font: inherit; font-weight: 600; border-radius: 999px; padding: 9px 20px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.go { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  button.go:hover { filter: brightness(1.08); }
  button.danger { background: var(--danger); color: #1a0b0b; border-color: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  .bar { height: 6px; background: var(--panel); border-radius: 99px; overflow: hidden; margin-top: 20px; }
  .bar div { height: 100%; width: 35%; background: var(--accent); border-radius: 99px; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  .error { color: var(--danger); margin-top: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="page"></main>
<footer>
  <div class="steps" id="steps"></div>
  <button id="back">Cancel</button>
  <button id="next" class="go">Next</button>
</footer>
<script>
  var invoke = window.__TAURI_INTERNALS__.invoke;
  var mode = new URLSearchParams(location.search).get("mode") || "install";
  var info = { platform: "linux", version: "", default_dir: "", upgrade: false };
  var state = { step: 0, dir: "", menu: true, desktop: true, everything: false, busy: false, error: "" };
  var page = document.getElementById("page"), next = document.getElementById("next"), back = document.getElementById("back");

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function menuWord() { return info.platform === "mac" ? "Add to the Dock" : info.platform === "windows" ? "Add to the Start menu" : "Add to the applications menu"; }

  var installSteps = [
    function () {
      document.title = info.upgrade ? "Update Jace Media" : "Set up Jace Media";
      return '<div class="hero"><img src="icon.png" alt="" /><div>' +
        "<h1>" + (info.upgrade ? "Update Jace Media" : "Welcome to Jace Media") + "</h1>" +
        "<p>This sets up <b style=\"color:var(--fg)\">Jace Media " + esc(info.version) + "</b> on your computer. It will:</p><ul>" +
        "<li>copy it to a folder you choose</li>" +
        "<li>" + (info.platform === "mac" ? "add it to the Dock, Launchpad and your desktop" : info.platform === "windows" ? "add it to the Start menu and your desktop" : "add it to your applications menu and desktop") + "</li>" +
        (info.platform === "windows" ? "<li>list it in Installed apps, so it's easy to delete</li>" : "") +
        (info.platform === "mac" ? "<li>stop macOS from calling it \"damaged\"</li>" : "") +
        "<li>start it and remove this download</li></ul>" +
        (info.upgrade ? "<p style=\"margin-top:12px\">A copy is already set up; it will be replaced. Your sign-in and settings are kept.</p>" : "") +
        "</div></div>";
    },
    function () {
      return "<h1>Where should it go?</h1><p>You can keep the suggested folder.</p>" +
        '<label class="field" for="dir">Install to</label><div class="row"><input type="text" id="dir" value="' + esc(state.dir) + '" spellcheck="false" /></div>' +
        '<label class="check"><input type="checkbox" id="menu"' + (state.menu ? " checked" : "") + " /><span>" + menuWord() + "</span></label>" +
        '<label class="check"><input type="checkbox" id="desktop"' + (state.desktop ? " checked" : "") + " /><span>Add a desktop shortcut</span></label>";
    },
    function () {
      return "<h1>Setting up Jace Media…</h1><p>This takes a few seconds. Jace Media opens when it's done.</p>" +
        (state.error ? '<p class="error">' + esc(state.error) + "</p>" : '<div class="bar"><div></div></div>');
    },
  ];

  var uninstallSteps = [
    function () {
      document.title = "Delete Jace Media";
      return '<div class="hero"><img src="icon.png" alt="" /><div><h1>Delete Jace Media?</h1>' +
        "<p>This removes the app and its shortcuts from this computer. Your Jace account, subscriptions and library stay on Jace Media.</p>" +
        '<label class="check"><input type="checkbox" id="everything"' + (state.everything ? " checked" : "") + " /><span>Also remove sign-in and settings on this computer<small>Otherwise they're kept for next time.</small></span></label>" +
        (state.error ? '<p class="error">' + esc(state.error) + "</p>" : "") + "</div></div>";
    },
    function () {
      return "<h1>Deleting Jace Media…</h1><p>The window closes when it's done.</p><div class=\"bar\"><div></div></div>";
    },
  ];

  function steps() { return mode === "uninstall" ? uninstallSteps : installSteps; }

  function render() {
    var list = steps();
    page.innerHTML = list[state.step]();
    var dots = "";
    for (var i = 0; i < list.length; i++) dots += '<i class="' + (i <= state.step ? "on" : "") + '"></i>';
    document.getElementById("steps").innerHTML = dots;
    var working = state.busy;
    if (mode === "uninstall") {
      next.textContent = "Delete";
      next.className = "danger";
      next.hidden = state.step === 1;
      back.textContent = "Cancel";
      back.hidden = state.step === 1;
    } else {
      next.textContent = state.step === 0 ? "Next" : state.error ? "Try again" : "Install";
      next.className = "go";
      next.hidden = state.step === 2 && !state.error;
      back.textContent = state.step === 0 ? "Cancel" : "Back";
      back.hidden = working;
    }
    var dir = document.getElementById("dir");
    if (dir) { dir.oninput = function () { state.dir = dir.value; }; }
    var m = document.getElementById("menu"); if (m) m.onchange = function () { state.menu = m.checked; };
    var d = document.getElementById("desktop"); if (d) d.onchange = function () { state.desktop = d.checked; };
    var e = document.getElementById("everything"); if (e) e.onchange = function () { state.everything = e.checked; };
    next.focus();
  }

  next.onclick = function () {
    if (mode === "uninstall") {
      state.step = 1; state.error = ""; render();
      invoke("setup_uninstall", { everything: state.everything }).catch(function (err) { state.step = 0; state.error = String(err); render(); });
      return;
    }
    if (state.step === 0) { state.step = 1; render(); return; }
    state.step = 2; state.busy = true; state.error = ""; render();
    invoke("setup_install", { dir: state.dir, menu: state.menu, desktop: state.desktop })
      .catch(function (err) { state.busy = false; state.error = String(err); render(); });
  };
  back.onclick = function () {
    if (state.step === 0 || mode === "uninstall") { invoke("setup_cancel"); return; }
    state.step = state.step === 2 ? 1 : state.step - 1; state.error = ""; render();
  };
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !next.hidden && !next.disabled) next.click();
    if (e.key === "Escape") back.click();
  });

  invoke("setup_info").then(function (i) { info = i; state.dir = i.default_dir; render(); }).catch(render);
</script>
</body>
</html>
